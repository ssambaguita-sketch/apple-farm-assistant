name: OpenDART Event Backtest Weekly

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/opendart-backtest-weekly.yml'
      - 'tools/backtest_event_engine.py'
      - 'tools/calibrate_event_weights.py'
  workflow_dispatch:
  schedule:
    - cron: '40 8 * * 6'

concurrency:
  group: opendart-event-backtest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas yfinance
      - name: Validate OpenDART secret
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: |
          test -n "$OPENDART_API_KEY" || (echo "OPENDART_API_KEY secret is missing" && exit 2)
      - name: Rebuild current discovery watchlist
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          DISCOVERY_DAYS: 3
          DISCOVERY_MAX: 30
        run: python tools/opendart_auto_discovery.py
      - name: Resolve corp codes and current market board
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          INVESTMENT_WATCHLIST: investment_daily/generated_watchlist.csv
        run: python tools/daily_investment_monitor.py
      - name: Run five-year event backtest
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          BACKTEST_YEARS: 5
          INVESTMENT_WATCHLIST: investment_daily/generated_watchlist.csv
        run: python tools/backtest_event_engine.py
      - name: Calibrate empirical event weights
        run: python tools/calibrate_event_weights.py
      - name: Commit backtest summaries and calibrated weights
        run: |
          git config user.name "opendart-backtest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add investment_daily/backtest_stats.csv investment_daily/backtest_summary.json investment_daily/learned_weights.json || true
          if git diff --cached --quiet; then
            echo "No backtest summary changes"
          else
            git commit -m "Update OpenDART five-year backtest calibration"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Upload full backtest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opendart-backtest-${{ github.run_number }}
          path: |
            investment_daily/event_backtest_5y.csv
            investment_daily/backtest_stats.csv
            investment_daily/backtest_summary.json
            investment_daily/learned_weights.json
          if-no-files-found: warn
          retention-days: 30
