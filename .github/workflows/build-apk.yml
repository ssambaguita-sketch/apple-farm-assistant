name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name apple_farm_assistant .
          rm -rf test
          rm -f analysis_options.yaml

      - name: Apply selected fourth app icon
        shell: bash
        run: |
          set -euo pipefail
          ICON="assets/app_icon_fourth.svg"
          test -f "$ICON"
          if ! command -v convert >/dev/null 2>&1 && ! command -v magick >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          render_icon() {
            local size="$1"
            local out="$2"
            mkdir -p "$(dirname "$out")"
            if command -v magick >/dev/null 2>&1; then
              magick -background none "$ICON" -resize "${size}x${size}" "$out"
            else
              convert -background none "$ICON" -resize "${size}x${size}" "$out"
            fi
          }
          render_icon 48  android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          render_icon 72  android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          render_icon 96  android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          render_icon 144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          render_icon 192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Fix Flutter source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          s = s.replace("NavigationDestination(icon:Icon(Icons.more_horiz),label:'더보기')]));\n}}\nclass DashboardPage", "NavigationDestination(icon:Icon(Icons.more_horiz),label:'더보기')]));\n}\nclass DashboardPage", 1)
          p.write_text(s)
          PY

      - name: Configure Android permissions and notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          manifest_tag = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = (
              '<uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.CAMERA"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n'
              '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>'
          )
          if 'android.permission.INTERNET' not in s:
              s = s.replace(manifest_tag, manifest_tag + '\n    ' + perms)
          else:
              for permission in ['POST_NOTIFICATIONS', 'RECEIVE_BOOT_COMPLETED', 'REQUEST_INSTALL_PACKAGES']:
                  full = f'android.permission.{permission}'
                  if full not in s:
                      s = s.replace(manifest_tag, manifest_tag + f'\n    <uses-permission android:name="{full}"/>')
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          receivers = '''
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED" />
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                  </intent-filter>
              </receiver>
          '''
          if 'ScheduledNotificationReceiver' not in s:
              s = s.replace('</application>', receivers + '\n    </application>')
          p.write_text(s)

          kts = Path('android/app/build.gradle.kts')
          if kts.exists():
              g = kts.read_text()
              if 'isCoreLibraryDesugaringEnabled' not in g:
                  g = g.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              if 'coreLibraryDesugaring(' not in g:
                  g += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              kts.write_text(g)
          PY

      - name: Configure stable Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" && -n "${ANDROID_KEYSTORE_PASSWORD:-}" && -n "${ANDROID_KEY_ALIAS:-}" && -n "${ANDROID_KEY_PASSWORD:-}" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release-keystore.jks
          EOF
            python3 - <<'PY'
          from pathlib import Path
          kts = Path('android/app/build.gradle.kts')
          groovy = Path('android/app/build.gradle')
          if kts.exists():
              s = kts.read_text()
              if 'val keystoreProperties' not in s:
                  s = '''import java.util.Properties\nimport java.io.FileInputStream\n\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n}\n\n''' + s
              marker = '    buildTypes {\n'
              signing = '''    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n\n'''
              if 'create("release")' not in s:
                  s = s.replace(marker, signing + marker, 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              kts.write_text(s)
          elif groovy.exists():
              s = groovy.read_text()
              if 'def keystoreProperties' not in s:
                  s = '''def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file('key.properties')\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n}\n\n''' + s
              marker = '    buildTypes {\n'
              signing = '''    signingConfigs {\n        release {\n            keyAlias keystoreProperties['keyAlias']\n            keyPassword keystoreProperties['keyPassword']\n            storeFile file(keystoreProperties['storeFile'])\n            storePassword keystoreProperties['storePassword']\n        }\n    }\n\n'''
              if 'signingConfigs {' not in s:
                  s = s.replace(marker, signing + marker, 1)
              s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
              groovy.write_text(s)
          else:
              raise SystemExit('Android app Gradle file not found')
          PY
            keytool -list -keystore android/app/release-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
            echo "ANDROID_SIGNING_MODE=stable" >> "$GITHUB_ENV"
          else
            echo "ANDROID_SIGNING_MODE=fallback" >> "$GITHUB_ENV"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release -t lib/app_entry.dart

      - name: Verify APK signature and checksum
        id: apk_verify
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [[ -n "$APKSIGNER" ]]; then
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          fi

      - name: Prepare official APK name
        id: release_meta
        shell: bash
        run: |
          FULL_VERSION=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          TAG="v${FULL_VERSION}"
          mkdir -p dist
          APK_NAME="apple-farm-assistant-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${APK_NAME}"
          echo "version=${FULL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-farm-assistant-apk
          path: dist/${{ steps.release_meta.outputs.apk_name }}
          retention-days: 30

      - name: Publish official GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          APK_PATH: dist/${{ steps.release_meta.outputs.apk_name }}
          VERSION: ${{ steps.release_meta.outputs.version }}
          APK_SHA256: ${{ steps.apk_verify.outputs.sha256 }}
        shell: bash
        run: |
          NOTES=$(cat <<EOF
          공식 Android APK 배포입니다.

          - 버전: ${VERSION}
          - APK SHA-256: ${APK_SHA256}
          - Android 서명 모드: ${ANDROID_SIGNING_MODE:-fallback}
          - 앱 아이콘: 선택한 4번째 사과+달력 디자인
          - 앱 안에서 업데이트: GitHub Release 확인 · APK 자동 다운로드 · Android 덮어쓰기 설치 지원
          - 추천작업 강화 알림: Android 고중요도 채널 · 반복 알림 · 재부팅 후 예약 복구 지원

          경영·설정 > 앱 안에서 업데이트에서 이후 버전을 직접 갱신할 수 있습니다.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK_PATH" --target "$GITHUB_SHA" --title "사과 재배 관리 비서 ${VERSION}" --notes "$NOTES"
          fi
