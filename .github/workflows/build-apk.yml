name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name apple_farm_assistant .

      - name: Fix Flutter source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          s = s.replace("NavigationDestination(icon:Icon(Icons.more_horiz),label:'더보기')]));\n}}\nclass DashboardPage", "NavigationDestination(icon:Icon(Icons.more_horiz),label:'더보기')]));\n}\nclass DashboardPage", 1)
          p.write_text(s)
          PY

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          manifest_tag = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = (
              '<uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>'
          )
          if 'android.permission.INTERNET' not in s:
              s = s.replace(manifest_tag, manifest_tag + '\n    ' + perms)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apple-farm-assistant-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
