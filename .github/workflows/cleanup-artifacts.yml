name: Cleanup Actions Artifacts

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - '.github/workflows/cleanup-artifacts.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ROWS < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | "\(.id) \(.size_in_bytes)"'
          )

          COUNT=${#ROWS[@]}
          TOTAL=0
          for ROW in "${ROWS[@]}"; do
            ID="${ROW%% *}"
            SIZE="${ROW##* }"
            TOTAL=$((TOTAL + SIZE))
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}"
          done

          python3 - "$COUNT" "$TOTAL" <<'PY'
          import sys
          count = int(sys.argv[1])
          total = int(sys.argv[2])
          print(f"Deleted artifacts: {count}")
          print(f"Freed bytes: {total}")
          print(f"Freed MiB: {total / 1024 / 1024:.1f}")
          print(f"Freed GiB: {total / 1024 / 1024 / 1024:.2f}")
          PY

      - name: Verify artifact storage is empty
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          LEFT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=1" --jq '.total_count')
          echo "Remaining Actions artifacts: ${LEFT}"
          test "${LEFT}" -eq 0
