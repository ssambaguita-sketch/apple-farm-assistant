name: OpenDART Investment Daily

on:
  push:
    branches: [main]
    paths:
      - 'tools/opendart_auto_discovery.py'
      - 'tools/daily_investment_monitor.py'
      - 'tools/enrich_event_terms.py'
      - 'tools/investment_engine_v2.py'
      - 'tools/publish_dashboard_data.py'
      - 'config/investment_watchlist.csv'
      - '.github/workflows/opendart-investment-daily.yml'
  workflow_dispatch:
  schedule:
    - cron: '10 7 * * 1-5'

concurrency:
  group: opendart-investment-daily
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas yfinance
      - name: Validate OpenDART secret
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: |
          if [ -z "$OPENDART_API_KEY" ]; then
            echo "OPENDART_API_KEY secret is missing"
            exit 2
          fi
      - name: Discover new event candidates
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          DISCOVERY_DAYS: 3
          DISCOVERY_MAX: 30
        run: python tools/opendart_auto_discovery.py
      - name: Run daily market monitor
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          INVESTMENT_WATCHLIST: investment_daily/generated_watchlist.csv
        run: python tools/daily_investment_monitor.py
      - name: Enrich financing terms v1
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          DETAIL_LOOKBACK_DAYS: 120
        run: python tools/enrich_event_terms.py
      - name: Run investment engine v2
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          V2_LOOKBACK_DAYS: 365
        run: python tools/investment_engine_v2.py
      - name: Build dashboard data
        run: python tools/publish_dashboard_data.py
      - name: Commit latest dashboard data on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "opendart-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json public/filings.json
          if git diff --cached --quiet; then
            echo "No dashboard data changes"
          else
            git commit -m "Update OpenDART dashboard data"
            git push origin HEAD:main
          fi
      - name: Upload daily decision artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opendart-investment-daily-${{ github.run_number }}
          path: |
            investment_daily/
            public/data.json
            public/filings.json
          if-no-files-found: warn
          retention-days: 14
